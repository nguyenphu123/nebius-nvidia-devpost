<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Second Serving</title><link rel="stylesheet" href="/admin.css"><script type="module" src="/admin.js"></script></head><body>
<header><a href="/" class="brand">second serving.</a><div><span id="account"></span><button id="logout" class="secondary">Sign out</button></div></header>
<nav aria-label="Workspace navigation"><a href="/ops">Chain Operations</a><a href="/admin" aria-current="page">Catalog editor</a></nav>
<main><span class="eyebrow">CHAIN MANAGEMENT</span><h1>Your menu. Your branches.</h1><p class="notice">Edit shared menu items and branch assignments here. Use Chain Operations for recipes, inventory, equipment and incidents.</p><p id="status" role="status" aria-live="polite"></p>
<div class="tabs" role="tablist" aria-label="Manage catalog"><button id="tab-dishes" role="tab" aria-selected="true" aria-controls="dishes-panel">Menu</button><button id="tab-branches" role="tab" aria-selected="false" aria-controls="branches-panel" tabindex="-1">Branches</button></div>
<section id="dishes-panel" role="tabpanel" aria-labelledby="tab-dishes"><div class="grid"><div><h2>Menu items <span id="dish-count"></span></h2><div id="dishes-list"></div></div><form id="dish-form" class="panel"><h2 id="dish-title">Add a menu item</h2><input name="id" type="hidden"><label>Dish name<input name="name" maxlength="100" required placeholder="e.g. Karaage set"></label><div class="two"><label>Category<input name="category" maxlength="60" required placeholder="e.g. Side dishes"></label><label>Price · JPY<input name="price" type="number" min="0" max="1000000" step="1" required></label></div><label>Description<textarea name="description" maxlength="500" rows="2"></textarea></label><label>Allergen notes · optional<textarea name="allergens" maxlength="300" rows="2" placeholder="Staff-provided notes; verify against the recipe."></textarea></label><label class="check"><input name="active" type="checkbox" checked> Active menu item</label><button>Save menu item</button><button type="button" data-clear="dish" class="secondary">Clear / new item</button><p id="dish-status" role="status"></p></form></div></section>
<section id="branches-panel" role="tabpanel" aria-labelledby="tab-branches" hidden><div class="grid"><div><h2>Branches <span id="branch-count"></span></h2><div id="branches-list"></div></div><form id="branch-form" class="panel"><h2 id="branch-title">Add a branch</h2><input name="id" type="hidden"><label>Branch name<input name="name" maxlength="100" required placeholder="e.g. Shinjuku East"></label><label>Address / area<input name="address" maxlength="250" required></label><label>Equipment notes<textarea name="equipment" maxlength="300" rows="2" placeholder="e.g. Fryer, ramen station"></textarea></label><label>Description<textarea name="description" maxlength="500" rows="2"></textarea></label><fieldset><legend>Menu available at this branch</legend><div id="branch-menu"></div></fieldset><label class="check"><input name="active" type="checkbox" checked> Active branch</label><button>Save branch</button><button type="button" data-clear="branch" class="secondary">Clear / new branch</button><p id="branch-status" role="status"></p></form></div></section></main></body></html>
